<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RetailPulse AI{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT:'#2563eb', dark:'#1d4ed8', light:'#dbeafe' },
            accent: '#7c3aed',
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* ── Sidebar nav links ─────────────────────────────────────── */
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #475569;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .nav-link:hover:not(.active) {
      background: #f1f5f9;
      color: #1e293b;
    }
    .nav-link.active {
      background: #dbeafe;
      color: #1d4ed8 !important;
      font-weight: 600;
    }
    .nav-link.active i { color: #2563eb; }
    .nav-link i { width: 16px; text-align: center; color: #94a3b8; font-size: 0.8125rem; }

    /* ── KPI card hover ───────────────────────────────────────── */
    .kpi-card { transition: transform 0.18s, box-shadow 0.18s; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); }

    /* ── Spinner ──────────────────────────────────────────────── */
    .spinner {
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      width: 28px; height: 28px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Table rows ───────────────────────────────────────────── */
    tbody tr:hover { background: #f8fafc; }

    /* ── Mobile sidebar ───────────────────────────────────────── */
    #sidebar { transition: transform 0.25s ease; }
    @media (max-width: 767px) {
      #sidebar { transform: translateX(-100%); position: fixed; z-index: 50; height: 100%; }
      #sidebar.open { transform: translateX(0); }
    }

    /* ── Chart container ──────────────────────────────────────── */
    .chart-wrapper { position: relative; }

    /* ── Card section header ──────────────────────────────────── */
    .card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* ── Table header ─────────────────────────────────────────── */
    thead tr th {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 12px;
    }
    tbody td { padding: 9px 12px; color: #334155; font-size: 0.8125rem; border-bottom: 1px solid #f1f5f9; }

    /* ── Form inputs ──────────────────────────────────────────── */
    input[type="number"], input[type="text"], select {
      font-size: 0.8125rem;
    }

    /* ── Page title ───────────────────────────────────────────── */
    .page-title { font-size: 1.375rem; font-weight: 700; color: #0f172a; }
    .page-subtitle { font-size: 0.8125rem; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col">

  <!-- ── Top Navbar ──────────────────────────────────────────────────── -->
  <header class="bg-white border-b border-slate-200 shadow-sm z-40 sticky top-0">
    <div class="flex items-center justify-between h-13 px-4" style="height:52px;">
      <div class="flex items-center gap-3">
        <!-- Hamburger (mobile) -->
        <button id="menuToggle" class="md:hidden text-slate-500 focus:outline-none"
                onclick="document.getElementById('sidebar').classList.toggle('open')">
          <i class="fas fa-bars text-base"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
            <i class="fas fa-chart-line text-white text-xs"></i>
          </div>
          <span class="font-bold text-base tracking-tight text-slate-800">
            RetailPulse <span class="text-blue-600">AI</span>
          </span>
        </div>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span class="hidden sm:flex items-center gap-1.5 text-slate-500 text-xs">
          <i class="fas fa-database text-slate-400 text-xs"></i>
          E-Commerce Analytics
        </span>
        <div id="healthBadge"
             class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-100 text-xs font-medium text-slate-600">
          <span class="w-2 h-2 rounded-full bg-slate-300" id="healthDot"></span>
          <span id="healthText">Checking…</span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- ── Sidebar ─────────────────────────────────────────────────── -->
    <aside id="sidebar"
           class="w-56 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col overflow-y-auto">
      <nav class="flex-1 py-4 px-3 space-y-0.5">

        <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 pb-1 pt-1">
          Dashboard
        </p>
        <a href="/"
           class="nav-link {% if request.path == '/' %}active{% endif %}">
          <i class="fas fa-home"></i> Overview
        </a>

        <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 pb-1 pt-3">
          Analytics
        </p>
        <a href="/sales"
           class="nav-link {% if request.path == '/sales' %}active{% endif %}">
          <i class="fas fa-chart-bar"></i> Sales &amp; Products
        </a>
        <a href="/customers"
           class="nav-link {% if request.path == '/customers' %}active{% endif %}">
          <i class="fas fa-users"></i> Customers
        </a>

        <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest px-2 pb-1 pt-3">
          Intelligence
        </p>
        <a href="/risk"
           class="nav-link {% if request.path == '/risk' %}active{% endif %}">
          <i class="fas fa-shield-halved"></i> Risk &amp; Opportunities
        </a>
        <a href="/prediction"
           class="nav-link {% if request.path == '/prediction' %}active{% endif %}">
          <i class="fas fa-brain"></i> AI Churn Prediction
        </a>
      </nav>

      <!-- Sidebar footer -->
      <div class="px-4 py-3 border-t border-slate-200">
        <div class="text-xs font-semibold text-slate-600">RetailPulse AI v1.0</div>
        <div class="text-xs text-slate-400 mt-0.5">Dataset: Jan 2024 – Nov 2025</div>
      </div>
    </aside>

    <!-- ── Main Content ─────────────────────────────────────────────── -->
    <main class="flex-1 overflow-y-auto bg-slate-50">
      <!-- Page overlay for mobile sidebar -->
      <div id="sidebarOverlay"
           class="hidden fixed inset-0 bg-black/30 z-40 md:hidden"
           onclick="document.getElementById('sidebar').classList.remove('open'); this.classList.add('hidden')">
      </div>

      <div class="p-5 sm:p-7 max-w-screen-2xl mx-auto">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <script>
    // Health check on load
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        const dot  = document.getElementById('healthDot');
        const text = document.getElementById('healthText');
        const badge = document.getElementById('healthBadge');
        if (d.status === 'ok') {
          dot.className  = 'w-2 h-2 rounded-full bg-emerald-500';
          text.textContent = 'System OK';
          badge.className  = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-xs font-medium text-emerald-700';
        } else {
          dot.className  = 'w-2 h-2 rounded-full bg-amber-500';
          text.textContent = 'Degraded';
          badge.className  = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 text-xs font-medium text-amber-700';
        }
      })
      .catch(() => {
        document.getElementById('healthDot').className = 'w-2 h-2 rounded-full bg-red-500';
        document.getElementById('healthText').textContent = 'Offline';
        document.getElementById('healthBadge').className =
          'flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-red-50 text-xs font-medium text-red-700';
      });

    // Mobile sidebar overlay
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('sidebarOverlay').classList.remove('hidden');
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
